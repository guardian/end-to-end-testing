name: Publish image to GHCR

on:
  workflow_call:
    outputs:
      tag:
        description: Application image tag derived from the main branch commit or Dockerfile hash
        value: ${{ jobs.image.outputs.tag }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}/application
          tags: >-
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main'
                && 'type=sha,format=long'
              || format('type=raw,value=dev-{0}', hashFiles('container-images/application-entrypoint.sh', 'container-images/application.Dockerfile')) }}
          flavor: latest=false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        id: login
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the application image is already published
        id: lookup
        if: steps.login.outcome == 'success'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null; then
            echo "Already published: $IMAGE_REF"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish application image
        if: steps.lookup.outputs.publish == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: container-images
          file: container-images/application.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application