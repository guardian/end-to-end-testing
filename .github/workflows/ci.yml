name: Build and publish npm package

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    uses: ./.github/workflows/publish-images.yml
    permissions:
      contents: read
      packages: write

  test:
    needs: publish-images
    env:
      APPLICATION_IMAGE_TAG: ${{ needs.publish-images.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run build

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-images, test]
    env:
      APPLICATION_IMAGE_TAG: ${{ needs.publish-images.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci
      
      - name: Create release pull request or publish to npm
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          publish-script: npx changeset publish
          pr-title: "🦋 Release package updates"
          commit-message: "Bump package version"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, '🐥 Canaries') &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: [publish-images, test]
    env:
      APPLICATION_IMAGE_TAG: ${{ needs.publish-images.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .tool-versions

      - run: npm ci

      - name: Create snapshot version
        run: npm run changeset -- version --snapshot "canary"

      - name: Release
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        id: publish-canary
        with:
          publish-script: npx changeset publish --tag canary
          push-git-tags: false
          create-github-releases: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@v9.0.0
        if: steps.publish-canary.outputs.published == 'true'
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const publishedPackages = ${{ steps.publish-canary.outputs.published-packages }};
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `> [!NOTE]`,
                `> The following canaries were published to NPM:`,
                `>`,
                ...publishedPackages.map((pkg) => `> - [\`${pkg.name}@${pkg.version}\`](https://www.npmjs.com/package/${pkg.name}/v/${pkg.version})`),
                '',
                '🐥'
              ].join('\n')
            });
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: '🐥 Canaries',
            });